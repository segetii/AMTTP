# ═══════════════════════════════════════════════════════════════════════════════
# AMTTP Cloudflare Overlay — adds gateway, Next.js dashboard, and tunnel
# ═══════════════════════════════════════════════════════════════════════════════
#
# Usage (overlay on top of the main docker-compose.yml):
#   docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up -d
#
# Exposed via Cloudflare Tunnel at https://amttp.com:
#   /              → Flutter Consumer App (static files via nginx)
#   /war-room      → Next.js War Room Dashboard
#   /api/          → Compliance Orchestrator API (8007)
#   /risk/         → ML Risk Engine (8000)
#   /zknaf/        → zkNAF Verifier (8010)
#   /oracle/       → Oracle Service (3001)
#
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # NGINX Gateway — unified reverse proxy for all services
  # ─────────────────────────────────────────────────────────────────────────────
  nginx-gateway:
    image: nginx:alpine
    container_name: amttp-gateway
    restart: unless-stopped
    volumes:
      - ./docker/nginx-production.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/amttp_app/build/web:/var/www/flutter:ro
      - ./frontend/frontend/.next/static:/var/www/nextjs/static:ro
    depends_on:
      - nextjs-dashboard
      - orchestrator
      - risk-engine
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # Next.js War Room Dashboard
  # ─────────────────────────────────────────────────────────────────────────────
  nextjs-dashboard:
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
    image: amttp-nextjs-warroom:latest
    container_name: amttp-dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3005
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=/api
    ports:
      - "3006:3005"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3005"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # Cloudflare Tunnel — secure ingress without exposing ports
  # ─────────────────────────────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: amttp-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml --no-autoupdate run
    volumes:
      - ./docker/cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDENTIALS:-C:/Users/Administrator/.cloudflared/ffc8edf6-0dd3-4bea-b7bb-99774355eed6.json}:/etc/cloudflared/credentials.json:ro
    depends_on:
      nginx-gateway:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
